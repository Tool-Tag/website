name: Capture live ToolTag public assets

on:
  push:
    branches:
      - workflow-v2-ui-20261004

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[capture-live]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow-v2-ui-20261004

      - name: Capture current public deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovered-live
          mkdir -p recovered-live
          curl -fL --retry 3 --retry-delay 2 https://tooltag.martinlab.studio/ -o recovered-live/index.html
          for path in app.js styles.css favicon.ico; do
            if curl -fL --retry 2 "https://tooltag.martinlab.studio/$path" -o "recovered-live/$path"; then
              echo "Captured $path"
            else
              rm -f "recovered-live/$path"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse

          base = "https://tooltag.martinlab.studio/"
          html = Path("recovered-live/index.html").read_text(errors="ignore")
          refs = set(re.findall(r'''(?:src|href)=["']([^"'?#]+\.(?:js|css))["']''', html, re.I))
          for ref in refs:
              url = urllib.parse.urljoin(base, ref)
              name = urllib.parse.urlparse(url).path.lstrip("/")
              if not name:
                  continue
              dest = Path("recovered-live") / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              try:
                  urllib.request.urlretrieve(url, dest)
                  print("Captured", url)
              except Exception as exc:
                  print("Skipped", url, exc)
          PY

      - name: Save recovered copy on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tooltag-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add recovered-live
          if git diff --cached --quiet; then
            echo "No live asset changes to commit."
            exit 0
          fi
          git commit -m "[capture-live] Recover current public ToolTag deployment"
          git push origin HEAD:workflow-v2-ui-20261004
