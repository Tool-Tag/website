name: Validate English cleanup and live badges

on:
  push:
    branches:
      - english-system-cleanup

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Lint (known baseline issues are non-blocking)
        continue-on-error: true
        run: npm run lint
