name: Validate document evidence architecture

on:
  push:
    branches:
      - document-evidence-architecture-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        continue-on-error: true
      - run: npm run lint
        continue-on-error: true
